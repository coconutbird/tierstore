[workspace]
resolver = "3"
members = [
    "crates/tierstore-core",
    "crates/tierstore",
    "crates/tierstore-mmap",
    "crates/tierstore-moka",
    "crates/rollover-demo",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/coconutbird/tierstore"
readme = "README.md"

# Single source of truth for dependency versions, internal and external.
[workspace.dependencies]
tierstore-core = { path = "crates/tierstore-core", version = "0.1.0" }
tierstore = { path = "crates/tierstore", version = "0.1.0" }
bytes = "1"
memmap2 = "0.9"
moka = { version = "0.12", features = ["future"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Capability traits live in `tier.rs` and are deliberately named `Tier*`.
module_name_repetitions = "allow"
